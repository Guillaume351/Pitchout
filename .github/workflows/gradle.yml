name: Gradle build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Pitchout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          path: Pitchout

      - name: Check out CookieDough
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: Guillaume351/CookieDough
          ref: ${{ vars.COOKIE_DOUGH_REF || ((github.head_ref == 'chore/paper-26-upgrade' || github.ref_name == 'chore/paper-26-upgrade') && 'chore/paper-26-upgrade') || 'dev' }}
          path: CookieDough

      - name: Set up Java 25
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Build Pitchout
        working-directory: Pitchout
        run: ./gradlew build --no-daemon

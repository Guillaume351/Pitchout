pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'Pitchout'

def cookieDoughDirectory = file('../CookieDough')
if (!cookieDoughDirectory.isDirectory()) {
    throw new GradleException(
            'CookieDough must be checked out next to Pitchout (expected ../CookieDough).'
    )
}

include ':CookieDough'
project(':CookieDough').projectDir = cookieDoughDirectory
